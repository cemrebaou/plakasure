<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaka Süre</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#111;color:#eee}
header{padding:10px 14px;font-weight:700;font-size:18px;background:#1b1b1b;display:flex;align-items:center;gap:10px}
header button{flex:0;padding:8px 14px;font-size:15px}
#baslik{flex:1}
.ekran{display:none}.ekran.acik{display:block}
#secim{padding:20px 14px}
#secim button{display:block;width:100%;padding:26px;font-size:22px;margin-bottom:14px;border-radius:12px}
#secim p{color:#aaa;font-size:14px;margin:-6px 4px 18px}
#cam{position:relative;width:100%;max-width:640px;margin:0 auto;background:#000}
video{width:100%;display:block}
#box{position:absolute;left:10%;top:38%;width:80%;height:24%;border:3px solid #0f0;border-radius:8px;pointer-events:none}
#durum{text-align:center;padding:6px;font-size:14px;color:#aaa;min-height:26px}
#sonuc{margin:8px 12px;padding:14px;border-radius:10px;font-size:20px;text-align:center;display:none}
.giris{background:#1d4d1d}.cikis{background:#5a3a00}
.btns{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
button{flex:1;padding:12px;font-size:16px;border:0;border-radius:8px;background:#2d6cdf;color:#fff}
button.gri{background:#444}
button.yesil{background:#1f8a3a}
#okuBtn{font-size:22px;padding:20px}
input{flex:2;padding:12px;font-size:16px;border-radius:8px;border:0;text-transform:uppercase}
h3{margin:14px 12px 4px;font-size:15px;color:#9cf}
ul{list-style:none;margin:0;padding:0 12px}
li{padding:8px;border-bottom:1px solid #333;font-size:14px}
li b{font-size:16px}
</style>
</head>
<body>
<header><button id="geriBtn" class="gri" style="display:none">← Geri</button><span id="baslik">🚗 Plaka Süre</span></header>

<!-- SEÇİM EKRANI -->
<div id="secim" class="ekran acik">
  <button id="otoSec" class="yesil">📷 Otomatik Mod</button>
  <p>Kamera sürekli açık, önüne gelen plakayı kendisi okur.</p>
  <button id="manSec">✋ Manuel Mod</button>
  <p>Otoparkçı plakaya tutar, “OKU” tuşuna basınca okur.</p>
</div>

<!-- KAMERA EKRANI -->
<div id="kamera" class="ekran">
  <div id="cam"><video id="v" autoplay playsinline muted></video><div id="box"></div></div>
  <div id="durum"></div>
  <canvas id="onizleme" style="display:none;max-width:70%;height:auto;margin:0 auto;border-radius:4px"></canvas>
  <div id="sonuc"></div>
  <div class="btns" id="manuelBtns"><button id="okuBtn" class="yesil">🔍 OKU</button></div>
  <div class="btns">
    <input id="elle" placeholder="Elle plaka (55ABC123)">
    <button id="elleBtn" class="gri">Ekle</button>
  </div>
</div>

<h3>İçeride olanlar</h3><ul id="aktif"></ul>
<h3>Geçmiş</h3><ul id="gecmis"></ul>
<div class="btns"><button id="silBtn" class="gri">Geçmişi Temizle</button></div>

<script>
const v=document.getElementById('v'), durum=document.getElementById('durum'), sonuc=document.getElementById('sonuc');
let aktif={}, gecmis=[], worker=null, workerYukleniyor=null, mod=null, mesgul=false, sonOkunan='', sonOkunanSay=0, sonIslem={}, akis=null, zamanlayici=null;
const BEKLEME=30000; // en az 30 sn geçmeden aynı plaka çıkış sayılmaz

function yukle(){try{aktif=JSON.parse(localStorage.getItem('pl_aktif')||'{}');gecmis=JSON.parse(localStorage.getItem('pl_gecmis')||'[]');}catch(e){}}
function kaydet(){try{localStorage.setItem('pl_aktif',JSON.stringify(aktif));localStorage.setItem('pl_gecmis',JSON.stringify(gecmis));}catch(e){}}
function saat(t){const d=new Date(t);return d.toLocaleDateString('tr-TR')+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});}
function sure(ms){const top=Math.max(0,Math.floor(ms/1000)),sn=top%60,dk=Math.floor(top/60)%60,s=Math.floor(top/3600);
  let t=[];if(s>=24){t.push(Math.floor(s/24)+' gün');if(s%24)t.push((s%24)+' saat');}else if(s)t.push(s+' saat');
  if(dk)t.push(dk+' dk');t.push(sn+' sn');return t.join(' ');}

function ciz(){
  const a=document.getElementById('aktif');a.innerHTML='';
  Object.keys(aktif).forEach(p=>{const li=document.createElement('li');
    li.innerHTML='<b>'+p+'</b> — giriş: '+saat(aktif[p])+'<br>⏱ <b style="color:#ffcc66">'+sure(Date.now()-aktif[p])+'</b>';a.appendChild(li);});
  if(!a.innerHTML)a.innerHTML='<li>Yok</li>';
  const g=document.getElementById('gecmis');g.innerHTML='';
  gecmis.slice().reverse().forEach(r=>{const li=document.createElement('li');
    li.innerHTML='<b>'+r.p+'</b> — '+saat(r.g)+' → '+saat(r.c)+' = <b>'+sure(r.c-r.g)+'</b>';g.appendChild(li);});
  if(!g.innerHTML)g.innerHTML='<li>Yok</li>';
}

function goster(txt,sinif){sonuc.className=sinif;sonuc.innerHTML=txt;sonuc.style.display='block';
  try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}}

function islem(p,zorla){
  const simdi=Date.now();
  if(!zorla&&sonIslem[p]&&simdi-sonIslem[p]<BEKLEME)return;
  if(aktif[p]&&simdi-aktif[p]<BEKLEME){
    if(zorla)goster('<b>'+p+'</b> zaten kayıtlı<br>Çıkış için en az 30 sn geçmeli ('+sure(simdi-aktif[p])+' geçti)','giris');
    return;}
  sonIslem[p]=simdi;
  if(aktif[p]){
    const g=aktif[p];delete aktif[p];gecmis.push({p:p,g:g,c:simdi});
    goster('<b>'+p+'</b><br>Giriş: '+saat(g)+'<br>Çıkış: '+saat(simdi)+'<br>⏱ <b>'+sure(simdi-g)+' geçmiş</b>','cikis');
  }else{
    aktif[p]=simdi;
    goster('<b>'+p+'</b> kaydedildi<br>'+saat(simdi),'giris');
  }
  kaydet();ciz();
}

// OCR metninden Türk plakası çıkar (harf/rakam karışıklıklarını düzelterek)
const IL={1:[4],2:[3,4],3:[2,3]}; // harf sayısı -> izinli rakam sayıları
const toD={O:'0',D:'0',Q:'0',U:'0',I:'1',L:'1',J:'1',Z:'2',S:'5',B:'8',G:'6',T:'7',A:'4'};
const toL={'0':'O','1':'I','2':'Z','5':'S','8':'B','6':'G','4':'A','7':'T'};
function plakaBul(t){
  let s=(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^TR/,'');
  let en=null;
  for(let i=0;i+5<=s.length;i++){
    let maliyet=0,il='';
    for(const c of s.substr(i,2)){if(/\d/.test(c))il+=c;else if(toD[c]){il+=toD[c];maliyet++;}else il+='X';}
    if(!/^(0[1-9]|[1-7][0-9]|8[01])$/.test(il))continue;
    for(const L of [1,2,3])for(const N of IL[L]){
      if(i+2+L+N>s.length)continue;
      let m=maliyet,har='',rak='',ok=true;
      for(const c of s.substr(i+2,L)){if(/[A-Z]/.test(c))har+=c;else if(toL[c]){har+=toL[c];m++;}else ok=false;}
      for(const c of s.substr(i+2+L,N)){if(/\d/.test(c))rak+=c;else if(toD[c]){rak+=toD[c];m++;}else ok=false;}
      if(!ok)continue;
      const puan=m*10-(L+N); // az düzeltme, uzun plaka tercih
      if(!en||puan<en.puan)en={puan:puan,p:il+' '+har+' '+rak};
    }
  }
  return en&&en.puan<20?en.p:null;
}

function otsu(d){
  const h=new Array(256).fill(0),n=d.length/4;
  for(let i=0;i<d.length;i+=4)h[d[i]]++;
  let top=0;for(let i=0;i<256;i++)top+=i*h[i];
  let sB=0,wB=0,max=0,esik=127;
  for(let i=0;i<256;i++){wB+=h[i];if(!wB)continue;const wF=n-wB;if(!wF)break;
    sB+=i*h[i];const mB=sB/wB,mF=(top-sB)/wF,v2=wB*wF*(mB-mF)*(mB-mF);if(v2>max){max=v2;esik=i;}}
  return esik;
}

// Kesilen bölgeyi büyüt, siyah-beyaz yap, kenar boşluğu ekle
function hazirla(sx,sy,sw,sh,hedefH){
  const o=hedefH/sh,P=20;
  const c=document.createElement('canvas');c.width=Math.round(sw*o)+2*P;c.height=Math.round(sh*o)+2*P;
  const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.filter='grayscale(1)';x.drawImage(v,sx,sy,sw,sh,P,P,c.width-2*P,c.height-2*P);x.filter='none';
  const im=x.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=0;i<d.length;i+=4){const g=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11)|0;d[i]=d[i+1]=d[i+2]=g;}
  const e=otsu(d);
  for(let i=0;i<d.length;i+=4){const k=d[i]>e?255:0;d[i]=d[i+1]=d[i+2]=k;}
  x.putImageData(im,0,0);return c;
}

// Mavi TR şeridini bul -> plaka dikdörtgenleri
function plakaAdaylari(){
  const vw=v.videoWidth,vh=v.videoHeight,W=640,sc=W/vw,H=Math.round(vh*sc);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data,mask=new Uint8Array(W*H);
  for(let i=0,j=0;j<W*H;i+=4,j++){const r=d[i],g=d[i+1],b=d[i+2];if(b>80&&b-r>55&&b-g>20)mask[j]=1;}
  const aday=[],yig=[];
  for(let j=0;j<W*H;j++){if(mask[j]!==1)continue;
    let x0=W,x1=0,y0=H,y1=0,say=0;yig.push(j);mask[j]=2;
    while(yig.length){const k=yig.pop(),px=k%W,py=(k-px)/W;say++;
      if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
      if(px>0&&mask[k-1]===1){mask[k-1]=2;yig.push(k-1);}
      if(px<W-1&&mask[k+1]===1){mask[k+1]=2;yig.push(k+1);}
      if(py>0&&mask[k-W]===1){mask[k-W]=2;yig.push(k-W);}
      if(py<H-1&&mask[k+W]===1){mask[k+W]=2;yig.push(k+W);}}
    const w=x1-x0+1,h=y1-y0+1,oran=h/w;
    if(h>=8&&oran>1.2&&oran<5&&say/(w*h)>0.45)aday.push({x0,x1,y0,y1,h,alan:say});
  }
  aday.sort((a,b)=>b.alan-a.alan);
  return aday.slice(0,3).map(a=>{
    const pad=a.h*0.06,bx=a.x1+1,ex=Math.min(W,a.x0+a.h*4.8),by=Math.max(0,a.y0-pad),ey=Math.min(H,a.y1+pad);
    return {sx:bx/sc,sy:by/sc,sw:(ex-bx)/sc,sh:(ey-by)/sc};
  }).filter(r=>r.sw>r.sh*2);
}

function onizle(c){const o=document.getElementById('onizleme'),x=o.getContext('2d');
  o.width=c.width;o.height=c.height;x.drawImage(c,0,0);o.style.display='block';}

async function kareOku(){
  // 1) Mavi şeritten plakayı bul ve sadece onu oku
  for(const r of plakaAdaylari()){
    const c=hazirla(r.sx,r.sy,r.sw,r.sh,110);
    const t=(await worker.recognize(c)).data.text;
    onizle(c);
    const p=plakaBul(t);if(p)return p;
  }
  // 2) Bulamazsa yeşil kutunun tamamında dağınık metin ara
  const vw=v.videoWidth,vh=v.videoHeight;
  const c=hazirla(vw*0.1,vh*0.38,vw*0.8,vh*0.24,Math.min(600,vh*0.24*2));
  await worker.setParameters({tessedit_pageseg_mode:'11'});
  let t='';try{t=(await worker.recognize(c)).data.text;}finally{await worker.setParameters({tessedit_pageseg_mode:'7'});}
  return plakaBul(t);
}
// Otomatik: sürekli tarar, aynı plakayı 2 kez görünce kabul eder
async function otoTur(){
  if(mod!=='oto'||mesgul||!worker||!v.videoWidth)return;
  mesgul=true;
  try{
    const p=await kareOku();
    if(mod!=='oto'){mesgul=false;return;}
    if(p){
      if(p===sonOkunan)sonOkunanSay++;else{sonOkunan=p;sonOkunanSay=1;}
      durum.textContent='Okunan: '+p;
      if(sonOkunanSay>=2){islem(p,false);sonOkunanSay=0;}
    }else durum.textContent='Plakayı yeşil kutuya getirin…';
  }catch(e){durum.textContent='Okuma hatası';}
  mesgul=false;
}

// Manuel: OKU'ya basınca birkaç kare dener, ilk bulduğunu işler
async function manuelOku(){
  if(mesgul)return;
  if(!worker){durum.textContent='Okuyucu henüz yüklenmedi, bekleyin…';return;}
  if(!v.videoWidth){durum.textContent='Kamera hazır değil';return;}
  mesgul=true;const btn=document.getElementById('okuBtn');btn.disabled=true;btn.textContent='Okunuyor…';
  let p=null;
  for(let i=0;i<3&&!p&&mod==='man';i++){try{p=await kareOku();}catch(e){}}
  if(mod==='man'){
    if(p){durum.textContent='Okunan: '+p;islem(p,true);}
    else durum.textContent='Okunamadı. Plakayı kutuya ortalayıp tekrar basın veya elle yazın.';
  }
  btn.disabled=false;btn.textContent='🔍 OKU';mesgul=false;
}

function okuyucuHazirla(){
  if(worker)return Promise.resolve();
  if(workerYukleniyor)return workerYukleniyor;
  workerYukleniyor=(async()=>{
    const w=await Tesseract.createWorker('eng');
    await w.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',tessedit_pageseg_mode:'7'});
    worker=w;
  })();
  return workerYukleniyor;
}

async function kameraAc(){
  try{
    akis=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=akis;return true;
  }catch(e){durum.textContent='Kamera açılamadı (izin verin). Elle ekleyebilirsiniz.';return false;}
}
function kameraKapat(){
  if(akis){akis.getTracks().forEach(t=>t.stop());akis=null;}
  v.srcObject=null;
}

async function modAc(m){
  mod=m;sonOkunan='';sonOkunanSay=0;sonuc.style.display='none';
  document.getElementById('secim').classList.remove('acik');
  document.getElementById('kamera').classList.add('acik');
  document.getElementById('geriBtn').style.display='';
  document.getElementById('baslik').textContent=m==='oto'?'📷 Otomatik Mod':'✋ Manuel Mod';
  document.getElementById('manuelBtns').style.display=m==='man'?'':'none';
  durum.textContent='Kamera açılıyor…';
  const ok=await kameraAc();
  if(mod!==m){kameraKapat();return;}
  if(!worker)durum.textContent='Okuyucu yükleniyor…';
  try{await okuyucuHazirla();}catch(e){durum.textContent='Okuyucu yüklenemedi (internet gerekli). Elle ekleyebilirsiniz.';return;}
  if(mod!==m)return;
  if(ok)durum.textContent=m==='oto'?'Hazır. Plakayı yeşil kutuya getirin.':'Hazır. Plakayı kutuya getirip OKU’ya basın.';
  if(m==='oto'){clearInterval(zamanlayici);zamanlayici=setInterval(otoTur,1200);}
}

function geri(){
  mod=null;clearInterval(zamanlayici);zamanlayici=null;kameraKapat();
  document.getElementById('kamera').classList.remove('acik');
  document.getElementById('secim').classList.add('acik');
  document.getElementById('geriBtn').style.display='none';
  document.getElementById('baslik').textContent='🚗 Plaka Süre';
}

document.getElementById('otoSec').onclick=()=>modAc('oto');
document.getElementById('manSec').onclick=()=>modAc('man');
document.getElementById('geriBtn').onclick=geri;
document.getElementById('okuBtn').onclick=manuelOku;
document.getElementById('elleBtn').onclick=()=>{
  const p=plakaBul(document.getElementById('elle').value);
  if(!p){durum.textContent='Geçersiz plaka';return;}
  islem(p,true);document.getElementById('elle').value='';};
document.getElementById('silBtn').onclick=()=>{gecmis=[];kaydet();ciz();};
setInterval(ciz,1000);
yukle();ciz();
okuyucuHazirla().catch(()=>{}); // arka planda önceden yükle
</script>
</body>
</html>
